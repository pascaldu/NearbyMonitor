name: Android CI

on:
  push:
  pull_request:

jobs:
  build-archived-v08:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore exact V0.8 source archive
        run: python tools/restore_v08_archive.py

      - name: Extract V0.8 archive
        run: unzip -q NearbyMonitorV08_GitHub_COMPLETE.zip

      - name: Build archived V0.8 debug APK
        working-directory: NearbyMonitorV08_GitHub
        run: gradle clean assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NearbyMonitor-v0.8-debug
          path: NearbyMonitorV08_GitHub/app/build/outputs/apk/debug/app-debug.apk
